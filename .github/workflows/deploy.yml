name: Cortex ai deployment
on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{secrets.AWS_REGION}}
  AWS_ACCOUNT_ID: ${{secrets.AWS_ACCOUNT_ID}}

jobs:  
  deploy-backend:
      runs-on : ubuntu-latest 
      steps:
        - name: Checkout
          uses:  actions/checkout@v4

        - name: AWS Configure
          uses: aws-actions/configure-aws-credentials@v6    
          with:
            aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
            aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
            aws-region: ${{env.AWS_REGION}}

        - name: Login to ECR   
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: build Gateway
          run: |
            docker build \
            -f backend/gateway/Dockerfile \
            -t gateway backend
        - name: Tag Gateway
          run: |
            docker tag gateway:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest  

        - name: Push Gateway
          run:  |
            docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest





        - name: build Auth
          run: |
            docker build \
            -f backend/services/auth/Dockerfile \
            -t auth-service backend
        - name: Tag Auth
          run: |
            docker tag auth-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest  

        - name: Push Auth
          run:  |
            docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest



        - name: build Chat
          run: |
            docker build \
            -f backend/services/chat/Dockerfile \
            -t chat-service backend

        - name: Tag Chat
          run: |
            docker tag chat-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest  

        - name: Push Chat
          run:  |
            docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest




        - name: build Agent
          run: |
            docker build \
            -f backend/services/agent/Dockerfile \
            -t agent-service backend
            
        - name: Tag Agent
          run: |
            docker tag agent-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest  

        - name: Push Agent
          run:  |
            docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest



        - name: deploy Gateway     
          run: |
            aws ecs update-service \
            --cluster ${{secrets.ECS_CLUSTER}} \
            --service ${{secrets.GATEWAY_SERVICE}} \
            --force-new-deployment

        - name: deploy Auth     
          run: |
            aws ecs update-service \
            --cluster ${{secrets.ECS_CLUSTER}} \
            --service ${{secrets.AUTH_SERVICE}} \
            --force-new-deployment
            
        - name: deploy Chat     
          run: |
            aws ecs update-service \
            --cluster ${{secrets.ECS_CLUSTER}} \
            --service ${{secrets.CHAT_SERVICE}} \
            --force-new-deployment

        - name: deploy AGENT     
          run: |
            aws ecs update-service \
            --cluster ${{secrets.ECS_CLUSTER}} \
            --service ${{secrets.AGENT_SERVICE}} \
            --force-new-deployment



  deploy-frontend:
    needs:  deploy-backend
    runs-on : ubuntu-latest 
    steps:
      - name: Checkout
        uses:  actions/checkout@v4

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
        run: |
          cd frontend
          npm install
          npm run build
        
      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v6    
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{env.AWS_REGION}}    

      - name: upload to S3
        run: |
          aws s3 sync \
          frontend/dist \
          s3://${{secrets.S3_BUCKET}} \
          --delete

      - name: invalidate cloudfront
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{secrets.CLOUDFRONT_DISTRIBUTION_ID}} \
          --paths "/*"    



